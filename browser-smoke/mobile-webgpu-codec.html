<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnCodec WebGPU test</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; padding: 1rem; }
    main { max-width: 48rem; margin: 0 auto; }
    button { font: inherit; min-height: 2.75rem; padding: 0.5rem 0.8rem; }
    progress { width: 100%; height: 1.5rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">EnCodec WebGPU encode and decode</h1>
    <p id="description" class="muted">This test runs the encoder, entropy codec, and decoder.</p>
    <button id="run" type="button">Run encode and decode</button>
    <p id="phase">Ready</p>
    <progress id="progress" value="0" max="1"></progress>
    <pre id="result"></pre>
  </main>
  <script type="module" src="./mobile-webgpu-codec.js"></script>
</body>
</html>
