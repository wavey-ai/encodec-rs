name: EncodecMLXDeviceBench
options:
  bundleIdPrefix: ai.wavey
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/RustLib/$(PLATFORM_NAME)"
    OTHER_LDFLAGS: "$(inherited) -lencodec_rs"
packages:
  EncodecMLXRuntime:
    path: ..
targets:
  EncodecMLXDeviceBench:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: EncodecMLXRuntime
        product: EncodecMLXRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wavey.encodec.mlxbench
        PRODUCT_NAME: EncodecMLXDeviceBench
        INFOPLIST_FILE: Sources/Info.plist
    preBuildScripts:
      - name: Build Rust bridge
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-rust-bridge.sh"
    postCompileScripts:
      - name: Bundle benchmark assets
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/bundle-benchmark-assets.sh"
